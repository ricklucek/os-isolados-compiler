name: C99 validation

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make clean && make
      - name: Full test suite
        run: make test
      - name: Sanitizers
        run: make test-sanitize
