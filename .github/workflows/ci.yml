name: C99 validation

on:
  pull_request:
  push:

concurrency:
  group: c99-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 mlir-18-tools
      - name: Build
        run: make clean && make
      - name: Full test suite
        run: make test
      - name: Helper commands
        run: |
          make check FILE=tests/niveis/nivel1_soma.mcn
          make inspect FILE=tests/niveis/nivel1_soma.mcn >/dev/null
          make check-dir DIR=tests/niveis
          make show-mem2reg FILE=tests/execucao/05_lacos.mcn >/dev/null
          make audit-llvm FILE=tests/execucao/17_agregados_globais.mcn
          make check-avr FILE=tests/execucao/02_variaveis_expressoes.mcn
          make test-dsl
          make mlir-pipeline FILE=tests/dsl/validos/01_elementwise.mcn OUTDIR=.ci-mlir >/dev/null
          make test-hybrid
          make bench-info >/dev/null
      - name: Sanitizers
        run: make test-sanitize
      - name: Delivery package
        run: |
          make package
          test -f macaronica-entrega.zip
          test -z "$(unzip -Z1 macaronica-entrega.zip | grep '/macaronica$' || true)"
          test -z "$(unzip -Z1 macaronica-entrega.zip | grep '[.]o$' || true)"
